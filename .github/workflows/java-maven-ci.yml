name: Java Maven CI with SonarQube

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Analyze Java Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: java-app
        run: mvn clean install

      - name: Verify Sonar token is available
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is available"
            echo "Token length: ${#SONAR_TOKEN}"
          else
            echo "SONAR_TOKEN is NOT available"
            exit 1
          fi

      - name: Test SonarQube authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -u "$SONAR_TOKEN:" \
            https://sonarcloud.io/api/authentication/validate)

          echo "SonarQube authentication HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "SonarQube authentication successful"
          else
            echo "SonarQube authentication failed"
            exit 1
          fi

      - name: Test Sonar JRE endpoint
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/sonar-response.txt -w "%{http_code}" \
            -u "$SONAR_TOKEN:" \
            "https://api.sonarcloud.io/analysis/jres?os=linux&arch=x86_64")

          echo "Sonar JRE endpoint HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Sonar JRE endpoint is accessible"
          else
            echo "Sonar JRE endpoint returned HTTP $HTTP_CODE"
            cat /tmp/sonar-response.txt
            exit 1
          fi

      - name: Build and analyze with SonarQube
        working-directory: java-app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=yuvi2102 \
            -Dsonar.projectKey=Yuvi2102_github-actions-practice
